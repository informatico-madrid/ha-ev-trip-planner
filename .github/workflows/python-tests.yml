name: Python Tests

on:
  push:
    branches: [ main, master, 'epic/**' ]
  pull_request:
    branches: [ main, master, 'epic/**' ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: requirements_ci.txt

    - name: Install dependencies
      run: |
        python3 -m venv .venv
        . .venv/bin/activate
        python3 -m pip install --upgrade pip
        pip install -r requirements_ci.txt

    - name: Essential CI (lint, types and Python tests)
      run: |
        . .venv/bin/activate
        make quality-gate-ci

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Native panel regression tests
      run: node --experimental-vm-modules --test --test-reporter=spec tests/panel-planning.test.mjs

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: python-test-results
        path: test-results/junit.xml
      continue-on-error: true
